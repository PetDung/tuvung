name: agri-trace

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agri-trace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agri_trace_db}
      POSTGRES_USER: ${POSTGRES_USER:-agri_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agri_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agri-trace-net
volumes:
  postgres_data:

networks:
  agri-trace-net:
    driver: bridge
